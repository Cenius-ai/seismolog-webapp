[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seismolog"
version = "1.0.0"
description = "Record seismic events, measure distance to tectonic plate boundaries and compare magnitudes over time."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []
keywords = ["seismology", "earthquake", "cli", "haversine"]

[project.scripts]
seismolog = "seismolog:main"

[tool.setuptools]
py-modules = ["seismolog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
